global:
  scrape_interval: 5s # Prometheus vient récupérer les métriques toutes les 5 secondes

scrape_configs:
  - job_name: 'coreflow-backend'
    metrics_path: '/actuator/prometheus' # L'URL qu'on vient de valider !
    static_configs:
      - targets: ['host.docker.internal:8080'] # Pointe vers ton app Spring Boot locale
